  sus: {
    label: "SUS test",
    description: "A focused System Usability Scale survey — welcome, the 10-item SUS questionnaire, then thank you.",
    icon: "clipboard",
    build: () => [makeBlock("welcome"), makeBlock("sus"), makeBlock("thankyou")]
  },
  seq: {
    label: "Task test with SEQ",
    description: "A single prototype task with an immediate Single Ease Question afterward.",
    icon: "gauge",
    build: () => [makeBlock("welcome"), makeBlock("task"), makeBlock("seq"), makeBlock("thankyou")]
  },
  abtest: {
    label: "A/B comparison",
    description: "Show two interfaces side by side and ask which one participants prefer, and why.",
    icon: "columns",
    build: () => [makeBlock("welcome"), makeBlock("abtest"), makeBlock("thankyou")]
  },
  blank: {
    label: "Blank study",
    description: "Start from scratch and build your own flow.",
    icon: "wand",
    build: () => [makeBlock("welcome"), makeBlock("thankyou")]
  }
};

function newStudy(templateKey) {
  const template = STUDY_TEMPLATES[templateKey] || STUDY_TEMPLATES.blank;
  const study = {
    id: uid(), title: "Untitled study", description: "",
    status: "draft", acceptingResponses: true, themeColor: DEFAULT_THEME_HEX,
    createdAt: Date.now(), updatedAt: Date.now(),
    blocks: template.build(),
    responses: []
  };
  db.studies[study.id] = study;
  db.order.unshift(study.id);
  persist();
  ui.newStudyModal = false;
  navigate("#/study/" + study.id + "/edit");
}
function duplicateStudy(id) {
  const src = db.studies[id];
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.title = src.title + " (copy)";
  copy.status = "draft";
  copy.responses = [];
  copy.createdAt = copy.updatedAt = Date.now();
  db.studies[copy.id] = copy;
  db.order.unshift(copy.id);
  persist(); render();
}
function deleteStudy(id) {
  if (!confirm("Delete this study and all its responses? This can't be undone.")) return;
  delete db.studies[id];
  db.order = db.order.filter(x => x !== id);
  persist(); render();
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener("click", (e) => {
  const stopEl = e.target.closest("[data-stop]");
  const menuTrigger = e.target.closest('[data-action="toggle-card-menu"],[data-action="toggle-add-menu"]');
  const el = e.target.closest("[data-action]");

  // close open menus/popovers when clicking elsewhere
  if (!stopEl && !menuTrigger) {
    if (ui.openMenu !== null) { ui.openMenu = null; render(); }
  }

  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    /* ---- dashboard ---- */
    case "open-new-study-modal": ui.newStudyModal = true; render(); break;
    case "close-new-study-modal": if (e.target === el) { ui.newStudyModal = false; render(); } break;
    case "create-study": newStudy(el.dataset.template); break;
    case "toggle-color-scheme": {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      applyColorScheme(isDark ? "light" : "dark");
      render();
      break;
    }
    case "theme-preset": {
      const study = currentStudyFromRoute();
      if (!study) break;
      const hex = el.dataset.hex;
      const hsl = hexToHSL(hex);
      ui.themeHSLDraft = { studyId: study.id, h: hsl.h, s: hsl.s, l: hsl.l };
      commitThemeColor(study, hex, ui.themeHSLDraft);
      break;
    }
    case "bg-preset": {
      const study = currentStudyFromRoute();
      if (!study) break;
      const hex = el.dataset.hex;
      const hsl = hexToHSL(hex);
      ui.bgHSLDraft = { studyId: study.id, h: hsl.h, s: hsl.s, l: hsl.l };
      commitBgColor(study, hex, ui.bgHSLDraft);
      break;
    }
    case "bg-reset": {
      const study = currentStudyFromRoute();
      if (!study) break;
      resetBgColor(study);
      break;
    }
    case "open-study": navigate("#/study/" + el.dataset.id + "/edit"); break;
    case "open-results": e.stopPropagation(); ui.openMenu = null; navigate("#/study/" + el.dataset.id + "/results"); break;
    case "duplicate-study": e.stopPropagation(); ui.openMenu = null; duplicateStudy(el.dataset.id); break;
    case "delete-study": e.stopPropagation(); ui.openMenu = null; deleteStudy(el.dataset.id); break;
    case "toggle-card-menu": {
      e.stopPropagation();
      ui.openMenu = ui.openMenu === el.dataset.id ? null : el.dataset.id;
      render();
      break;
    }

    /* ---- sharing / sync ---- */
    case "open-sync": ui.syncModal = true; ui.syncUrlDraft = null; ui.syncMsg = null; ui.scriptCopied = false; render(); break;
    case "close-sync": if (e.target === el || el.tagName === "BUTTON") { ui.syncModal = false; render(); } break;
    case "copy-script": {
      const key = (sync && sync.key) || ui.syncKeyDraft;
      const done = () => { ui.scriptCopied = true; render(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(appsScriptCode(key)).then(done).catch(done); else done();
      break;
    }
    case "sync-test": {
      const url = (ui.syncUrlDraft != null ? ui.syncUrlDraft : (sync ? sync.url : "")).trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) { ui.syncMsg = { ok: false, text: "That doesn't look like a Web app URL (it should end in /exec)." }; render(); break; }
      ui.syncMsg = { ok: true, text: "Testing…" }; render();
      apiGet(url, { action: "ping" }).then(r => { ui.syncMsg = r.ok ? { ok: true, text: "Connected ✓" } : { ok: false, text: "The script answered, but not as expected." }; })
        .catch(() => { ui.syncMsg = { ok: false, text: "Couldn't reach it. Make sure access is set to “Anyone” and you deployed a Web app." }; })
        .then(render);
      break;
    }
    case "sync-save": {
      const url = (ui.syncUrlDraft != null ? ui.syncUrlDraft : (sync ? sync.url : "")).trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) { ui.syncMsg = { ok: false, text: "That doesn't look like a Web app URL (it should end in /exec)." }; render(); break; }
      sync = { url, key: (sync && sync.key) || ui.syncKeyDraft || genAdminKey() };
      saveSync();
      syncState.hash = {}; syncState.resp = {};
      ui.syncMsg = { ok: true, text: "Saved. Published studies are being sent to your sheet." };
      syncPushDirty(); render();
      break;
    }
    case "sync-disconnect": sync = null; saveSync(); syncState.hash = {}; syncState.status = {}; syncState.resp = {}; ui.syncMsg = { ok: true, text: "Disconnected." }; render(); break;
    case "resync": { const st = db.studies[el.dataset.id]; if (st) pushStudy(st, true); break; }
    case "refresh-results": { fetchResponses(el.dataset.id, true); break; }
    case "share-email": {
      const st = db.studies[el.dataset.id];
      const body = "Hi,\n\nI'd really appreciate your help with a short study (" + st.title + "). It takes a few minutes:\n\n" + shareLink(st) + "\n\nThank you!";
      location.href = "mailto:?subject=" + encodeURIComponent("Quick study: " + st.title) + "&body=" + encodeURIComponent(body);
      break;
    }
    case "share-native": {
      const st = db.studies[el.dataset.id];
      navigator.share({ title: st.title, text: "Please take part in this short study:", url: shareLink(st) }).catch(() => {});
      break;
    }
    case "export-backup": {
      const blob = new Blob([JSON.stringify({ researchkit: 1, studies: db.studies, order: db.order }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "researchkit-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      break;
    }
    case "import-backup-pick": { const f = document.getElementById("rk-import"); if (f) f.click(); break; }
    case "import-backup": break;
    case "retry-submit": {
      const study = currentStudyFromRoute();
      if (study && ui.take) submitResponse(study, ui.take);
      break;
    }

    /* ---- studio shell ---- */
    case "goto-tab": navigate("#/study/" + el.dataset.id + "/" + el.dataset.tab); break;
    case "open-publish": ui.publishModal = el.dataset.id; ui.copied = false; render(); break;
    case "close-publish": if (e.target === el) { ui.publishModal = null; render(); } break;
    case "do-publish": {
      const study = db.studies[el.dataset.id];
      study.status = "published";
      study.publishedAt = Date.now();
      persist(); render();
      break;
    }
    case "toggle-accepting": {
      const study = db.studies[el.dataset.id];
      study.acceptingResponses = !study.acceptingResponses;
      persist(); render();
      break;
    }
    case "copy-link": {
      const link = el.dataset.link;
      const done = () => { ui.copied = true; render(); setTimeout(() => { ui.copied = false; render(); }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(done);
      else done();
      break;
    }
    case "set-results-tab": ui.resultsTab = el.dataset.tab; render(); break;
    case "toggle-response": ui.expandedResponse = ui.expandedResponse === el.dataset.id ? null : el.dataset.id; render(); break;

    /* ---- builder: add / manage blocks ---- */
    case "toggle-add-menu": {
      e.stopPropagation();
      ui.openMenu = ui.openMenu === el.dataset.kind ? null : el.dataset.kind;
      render();
      break;
    }
    case "add-block": {
      const study = currentStudyFromRoute();
      const type = el.dataset.type;
      const meta = BLOCK_REGISTRY[type];
      ui.openMenu = null;
      if (meta.singleton && study.blocks.some(b => b.type === type)) {
        ui.selectedBlockId = study.blocks.find(b => b.type === type).id;
      } else {
        const nb = makeBlock(type);
        study.blocks.push(nb);
        if (meta.autoFollowWith) study.blocks.push(makeBlock(meta.autoFollowWith));
        ui.selectedBlockId = nb.id;
      }
      study.updatedAt = Date.now();
      persist(); render();
      break;
    }
    case "select-block": {
      ui.selectedBlockId = el.closest("[data-block-id]").dataset.blockId;
      render();
      break;
    }
    case "delete-block": {
      e.stopPropagation();
      const study = currentStudyFromRoute();
      study.blocks = study.blocks.filter(b => b.id !== el.dataset.id);
      if (ui.selectedBlockId === el.dataset.id) ui.selectedBlockId = null;
      persist(); render();
      break;
    }
    case "duplicate-block": {
      e.stopPropagation();
      const study = currentStudyFromRoute();
      const idx = study.blocks.findIndex(b => b.id === el.dataset.id);
      const copy = { id: uid(), type: study.blocks[idx].type, config: JSON.parse(JSON.stringify(study.blocks[idx].config)) };
      study.blocks.splice(idx + 1, 0, copy);
      persist(); render();
      break;
    }
    case "move-block": {
      e.stopPropagation();
      const study = currentStudyFromRoute();
      const idx = study.blocks.findIndex(b => b.id === el.dataset.id);
      const newIdx = idx + parseInt(el.dataset.dir, 10);
      if (newIdx < 0 || newIdx >= study.blocks.length) break;
      [study.blocks[idx], study.blocks[newIdx]] = [study.blocks[newIdx], study.blocks[idx]];
      persist(); render();
      break;
    }
    case "set-field": {
      if (el.tagName === "BUTTON") {
        const study = currentStudyFromRoute();
        const block = study.blocks.find(b => b.id === ui.selectedBlockId);
        block.config[el.dataset.field] = el.dataset.value;
        persist(); render();
      }
      break;
    }
    case "toggle-field": {
      const study = currentStudyFromRoute();
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      block.config[el.dataset.field] = !block.config[el.dataset.field];
      persist(); render();
      break;
    }
    case "demo-remove": {
      const study = currentStudyFromRoute();
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      block.config.fields = block.config.fields.filter(f => f.id !== el.dataset.id);
      persist(); render();
      break;
    }
    case "demo-add": {
      const study = currentStudyFromRoute();
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      block.config.fields.push({ id: uid(), label: "New question", type: "text", options: [] });
      persist(); render();
      break;
    }
    case "demo-type": {
      const study = currentStudyFromRoute();
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      block.config.fields.find(f => f.id === el.dataset.id).type = el.dataset.value;
      persist(); render();
      break;
    }

    /* ---- in-builder ephemeral preview ---- */
    case "open-runner-preview": {
      ui.runnerPreview = { step: 0, responses: {}, finished: false, modalConfig: null };
      render();
      break;
    }
    case "close-runner-preview": ui.runnerPreview = null; render(); break;
    case "run-next": {
      if (el.disabled) break;
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      if (runner.step < study.blocks.length - 1) runner.step += 1;
      else runner.finished = true;
      render();
      if (runner === ui.take && runner.finished) saveTakeResponse(study, runner);
      break;
    }
    case "consent-toggle": break;
    case "open-prototype": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      runner.responses[current.id] = Object.assign({}, runner.responses[current.id], { visited: true });
      const cfg = current.config;
      const popupUrl = cfg.sourceType === "embed" ? extractSrcFromEmbed(cfg.embedCode) : cfg.prototypeUrl;
      if (cfg.openMode === "popup" && popupUrl) {
        const dims = cfg.deviceType === "mobile" ? "width=400,height=840" : "width=1180,height=800";
        window.open(popupUrl, "_blank", "noopener," + dims);
        render();
      } else {
        runner.modalConfig = current.config;
        render();
      }
      break;
    }
    case "close-modal": {
      // backdrop click should only close when the backdrop itself was clicked;
      // the explicit close button should always close, even if its icon was hit.
      if (el.tagName !== "BUTTON" && e.target !== el) break;
      activeRunner().modalConfig = null;
      render();
      break;
    }
    case "abtest-open": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      const variant = el.dataset.side === "A" ? current.config.variantA : current.config.variantB;
      runner.modalConfig = { prototypeUrl: variant.url, deviceType: variant.deviceType || "web", sourceType: "url" };
      render();
      break;
    }
    case "abtest-choose": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      const prev = runner.responses[current.id] || {};
      runner.responses[current.id] = Object.assign({}, prev, { choice: el.dataset.value, strength: el.dataset.value === "neutral" ? null : prev.strength });
      render();
      break;
    }
    case "abtest-strength": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      const prev = runner.responses[current.id] || {};
      runner.responses[current.id] = Object.assign({}, prev, { strength: parseInt(el.dataset.value, 10) });
      render();
      break;
    }
    case "seq-rate": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      runner.responses[current.id] = parseInt(el.dataset.value, 10);
      render();
      break;
    }
    case "sus-rate": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      const vals = runner.responses[current.id] ? runner.responses[current.id].slice() : Array(10).fill(null);
      vals[parseInt(el.dataset.index, 10)] = parseInt(el.dataset.value, 10);
      runner.responses[current.id] = vals;
      render();
      break;
    }
    default: break;
  }
});

function activeRunner() { return ui.take || ui.runnerPreview; }
function currentStudyFromRoute() {
  const r = parseRoute();
  if (r.view === "take" && r.api) { const st = syncState.remote[r.id]; return st && st.study; }
  return db.studies[r.id];
}
function saveTakeResponse(study, runner) {
  const route = parseRoute();
  if (route.view === "take" && route.api) {
    runner.pendingResponse = { id: uid(), submittedAt: Date.now(), answers: runner.responses };
    submitResponse(study, runner);
    return;
  }
  study.responses.push({ id: uid(), submittedAt: Date.now(), answers: runner.responses });
  study.updatedAt = Date.now();
  persist();
}
function submitResponse(study, runner) {
  const route = parseRoute();
  runner.submitState = "sending"; render();
  apiPost(route.api, { action: "submit", id: study.id, response: runner.pendingResponse })
    .then(r => { runner.submitState = r.ok ? "ok" : "error"; runner.submitError = r.ok ? null : syncErrorText(r.error); })
    .catch(() => { runner.submitState = "error"; runner.submitError = "Couldn't reach the server."; })
    .then(render);
}
document.addEventListener("change", (e) => {
  const el = e.target;
  if (!el.matches || !el.matches('[data-action="import-backup"]')) return;
  const f = el.files && el.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.studies || !d.order) throw new Error("bad");
      let n = 0;
      d.order.forEach(id => { if (!d.studies[id]) return; if (!db.studies[id]) db.order.push(id); db.studies[id] = d.studies[id]; n++; });
      persist();
      ui.syncMsg = { ok: true, text: "Imported " + n + " stud" + (n === 1 ? "y" : "ies") + "." };
    } catch (err) { ui.syncMsg = { ok: false, text: "That file isn't a ResearchKit backup." }; }
    render();
  };
  rd.readAsText(f);
});
document.addEventListener("input", (e) => {
  if (e.target.matches && e.target.matches("[data-sync-url]")) ui.syncUrlDraft = e.target.value;
});

/* Keeps a live-precision {h,s,l} draft while the researcher is actively
   dragging a colour picker's sliders, so repeatedly round-tripping through a
   hex string (which loses sub-integer precision) doesn't make the colour
   drift as they drag. Reset whenever a different study's picker is opened.
   Shared by both the accent ("theme") and background ("bg") pickers. */
function getColorDraft(draftField, study, currentHex) {
  const draft = ui[draftField];
  if (!draft || draft.studyId !== study.id) {
    const hsl = hexToHSL(currentHex);
    ui[draftField] = { studyId: study.id, h: hsl.h, s: hsl.s, l: hsl.l };
  }
  return ui[draftField];
}
function getThemeDraft(study) { return getColorDraft("themeHSLDraft", study, study.themeColor || DEFAULT_THEME_HEX); }
function getBgDraft(study) { return getColorDraft("bgHSLDraft", study, study.bgColor || DEFAULT_BG_HEX); }

function commitThemeColor(study, hex, draft) {
  study.themeColor = hex;
  study.updatedAt = Date.now();
  applyThemeColor(hex);
  persist();
  updateColorPickerDOM("theme", hex, draft);
}
function commitBgColor(study, hex, draft) {
  study.bgColor = hex;
  study.updatedAt = Date.now();
  applyBackgroundColor(hex);
  persist();
  updateColorPickerDOM("bg", hex, draft);
}
function resetBgColor(study) {
  study.bgColor = null;
  study.updatedAt = Date.now();
  clearBackgroundOverride();
  persist();
  render();
}
function updateColorPickerDOM(prefix, hex, draft) {
  const { h, s, l } = draft;
  const swatch = root.querySelector(`[data-role="${prefix}-swatch"]`);
  const hexInput = root.querySelector(`[data-role="${prefix}-hex"]`);
  const hSlider = root.querySelector(`[data-role="${prefix}-h"]`);
  const sSlider = root.querySelector(`[data-role="${prefix}-s"]`);
  const lSlider = root.querySelector(`[data-role="${prefix}-l"]`);
  if (swatch) swatch.style.background = hex;
  if (hexInput && document.activeElement !== hexInput) hexInput.value = hex;
  if (hSlider) { hSlider.value = h; hSlider.style.background = `linear-gradient(to right, hsl(0,${s}%,${l}%), hsl(60,${s}%,${l}%), hsl(120,${s}%,${l}%), hsl(180,${s}%,${l}%), hsl(240,${s}%,${l}%), hsl(300,${s}%,${l}%), hsl(360,${s}%,${l}%))`; }
  if (sSlider) { sSlider.value = s; sSlider.style.background = `linear-gradient(to right, hsl(${h},0%,${l}%), hsl(${h},100%,${l}%))`; }
  if (lSlider) { lSlider.value = l; lSlider.style.background = `linear-gradient(to right, hsl(${h},${s}%,0%), hsl(${h},${s}%,50%), hsl(${h},${s}%,100%))`; }
  const hVal = root.querySelector(`[data-role="${prefix}-h-val"]`); if (hVal) hVal.textContent = h;
  const sVal = root.querySelector(`[data-role="${prefix}-s-val"]`); if (sVal) sVal.textContent = s + "%";
  const lVal = root.querySelector(`[data-role="${prefix}-l-val"]`); if (lVal) lVal.textContent = l + "%";
}

document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const route = parseRoute();

  switch (action) {
    case "set-study-title": {
      const study = db.studies[route.id];
      if (!study) break;
      study.title = el.value;
      const crumb = root.querySelector(".crumbs .current");
      persist();
      break;
    }
    case "set-study-desc": {
      const study = db.studies[route.id];
      if (study) { study.description = el.value; persist(); }
      break;
    }
    case "set-field": {
      const study = db.studies[route.id];
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      block.config[el.dataset.field] = el.value;
      const card = root.querySelector(`.block-card[data-block-id="${block.id}"] .block-summary`);
      if (card) card.innerHTML = BLOCK_REGISTRY[block.type].summary(block.config);
      persist();
      break;
    }
    case "set-nested-field": {
      const study = db.studies[route.id];
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      setPath(block.config, el.dataset.path, el.value);
      const card = root.querySelector(`.block-card[data-block-id="${block.id}"] .block-summary`);
      if (card) card.innerHTML = BLOCK_REGISTRY[block.type].summary(block.config);
      persist();
      break;
    }
    case "abtest-why": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      const prev = runner.responses[current.id] || {};
      runner.responses[current.id] = Object.assign({}, prev, { why: el.value });
      break;
    }
    case "demo-label": {
      const study = db.studies[route.id];
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      const f = block.config.fields.find(f => f.id === el.dataset.id);
      f.label = el.value;
      const card = root.querySelector(`.block-card[data-block-id="${block.id}"] .block-summary`);
      if (card) card.innerHTML = BLOCK_REGISTRY[block.type].summary(block.config);
      persist();
      break;
    }
    case "demo-options": {
      const study = db.studies[route.id];
      const block = study.blocks.find(b => b.id === ui.selectedBlockId);
      const f = block.config.fields.find(f => f.id === el.dataset.id);
      f.options = el.value.split(",").map(s => s.trim()).filter(Boolean);
      persist();
      break;
    }
    case "theme-h": case "theme-s": case "theme-l": {
      const study = db.studies[route.id];
      if (!study) break;
      const draft = getThemeDraft(study);
      const v = parseInt(el.value, 10);
      if (action === "theme-h") draft.h = v;
      if (action === "theme-s") draft.s = v;
      if (action === "theme-l") draft.l = v;
      commitThemeColor(study, hslToHex(draft.h, draft.s, draft.l), draft);
      break;
    }
    case "theme-hex-input": {
      const study = db.studies[route.id];
      if (!study) break;
      const val = el.value.trim();
      if (/^#?[0-9a-fA-F]{6}$/.test(val)) {
        const hex = (val.startsWith("#") ? val : "#" + val).toUpperCase();
        const hsl = hexToHSL(hex);
        ui.themeHSLDraft = { studyId: study.id, h: hsl.h, s: hsl.s, l: hsl.l };
        commitThemeColor(study, hex, ui.themeHSLDraft);
      }
      break;
    }
    case "bg-h": case "bg-s": case "bg-l": {
      const study = db.studies[route.id];
      if (!study) break;
      const draft = getBgDraft(study);
      const v = parseInt(el.value, 10);
      if (action === "bg-h") draft.h = v;
      if (action === "bg-s") draft.s = v;
      if (action === "bg-l") draft.l = v;
      commitBgColor(study, hslToHex(draft.h, draft.s, draft.l), draft);
      break;
    }
    case "bg-hex-input": {
      const study = db.studies[route.id];
      if (!study) break;
      const val = el.value.trim();
      if (/^#?[0-9a-fA-F]{6}$/.test(val)) {
        const hex = (val.startsWith("#") ? val : "#" + val).toUpperCase();
        const hsl = hexToHSL(hex);
        ui.bgHSLDraft = { studyId: study.id, h: hsl.h, s: hsl.s, l: hsl.l };
        commitBgColor(study, hex, ui.bgHSLDraft);
      }
      break;
    }
    case "demo-answer": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      const vals = Object.assign({}, runner.responses[current.id]);
      vals[el.dataset.id] = el.value;
      runner.responses[current.id] = vals;
      break;
    }
    case "openended-answer": {
      const runner = activeRunner();
      const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
      const current = study.blocks[runner.step];
      runner.responses[current.id] = el.value;
      break;
    }
    default: break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.dataset.action === "consent-toggle") {
    const runner = activeRunner();
    const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
    const current = study.blocks[runner.step];
    runner.responses[current.id] = { agreed: el.checked };
    render();
  }
  if (el.dataset.action === "demo-answer" && el.tagName === "SELECT") {
    const runner = activeRunner();
    const study = currentStudyFromRoute() || db.studies[(ui.take||{}).studyId];
    const current = study.blocks[runner.step];
    const vals = Object.assign({}, runner.responses[current.id]);
    vals[el.dataset.id] = el.value;
    runner.responses[current.id] = vals;
    render();
  }
  if (el.dataset.action === "theme-hex-input" || el.dataset.action === "bg-hex-input") {
    // normalise the displayed text (e.g. add a leading #) once the field is
    // committed, without disturbing it while the researcher is still typing
    el.value = (currentStudyFromRoute() || {})[el.dataset.action === "theme-hex-input" ? "themeColor" : "bgColor"]
      || el.value;
  }
});

/* =========================================================================
   DRAG & DROP REORDERING (canvas)
   ========================================================================= */
let dragFromId = null;
document.addEventListener("dragstart", (e) => {
  const card = e.target.closest(".block-card");
  if (!card) return;
  dragFromId = card.dataset.blockId;
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragover", (e) => {
  const card = e.target.closest(".block-card");
  if (!card) return;
  e.preventDefault();
  root.querySelectorAll(".block-card.drag-over").forEach(c => c.classList.remove("drag-over"));
  card.classList.add("drag-over");
});
document.addEventListener("dragleave", (e) => {
  const card = e.target.closest(".block-card");
  if (card) card.classList.remove("drag-over");
});
document.addEventListener("drop", (e) => {
  const card = e.target.closest(".block-card");
  if (!card || !dragFromId) return;
  e.preventDefault();
  const toId = card.dataset.blockId;
  if (toId !== dragFromId) {
    const study = currentStudyFromRoute();
    const blocks = study.blocks;
    const fromIdx = blocks.findIndex(b => b.id === dragFromId);
    const toIdx = blocks.findIndex(b => b.id === toId);
    const [moved] = blocks.splice(fromIdx, 1);
    blocks.splice(toIdx, 0, moved);
    persist();
  }
  dragFromId = null;
  render();
});

/* =========================================================================
   INIT
   ========================================================================= */
render();
</script>
</body>
