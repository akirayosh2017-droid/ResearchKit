<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResearchKit — Usability Study Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Warm paper neutrals — ivory/sand instead of sterile white/grey */
    --paper:#F7EFDF; --panel:#FFFBF3; --line:#E3D3AE; --ink:#2B2116; --muted:#7A6C55; --faint:#A99A7C;

    /* Peacock teal — primary brand / interactive accent */
    --pine-50:#E3F1EE; --pine-100:#C3E1DC; --pine-300:#4FA79D; --pine-500:#0E7C7B; --pine-600:#0B6362; --pine-700:#0A4E4E;

    /* Marigold — warm secondary accent ("OK" states, warmth) */
    --amber-100:#FBE9C6; --amber-500:#E2A32D; --amber-600:#B97F1C;

    /* Vermilion — danger / "needs attention" accent */
    --rose-100:#FADAD0; --rose-500:#C34A25;

    /* Extra festival accents used sparingly for variety (tags, group icon tints, charts) */
    --purple-50:#F0E6F3; --purple-500:#6B2D8C; --purple-700:#4A1F63;
    --emerald-50:#DEF0E2; --emerald-500:#1E8A56; --emerald-700:#146540;
    --pink-50:#FBE3EC; --pink-500:#D14C82;
    --gold:#B08D2E; --brass:#9C7A3F;

    --font-display:'Baloo 2', 'Segoe UI', sans-serif;
    --font-sans:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  /* Dark mode — same warm, non-sterile philosophy: deep espresso-brown instead
     of neutral black/grey. Only the neutral surface tokens change; the brand
     and semantic accent colours stay vivid so they still read as accents. */
  html[data-theme="dark"]{
    --paper:#1E1811; --panel:#2A2116; --line:#4A3C29; --ink:#F2E8D6; --muted:#C6B392; --faint:#8C7A5C;
  }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{ background:#5A4B34; }
  html[data-theme="dark"] *{ scrollbar-color:#5A4B34 transparent; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--font-sans); background:var(--paper); color:var(--ink); font-size:14px; transition:background-color .2s, color .2s; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D9C7A0; border-radius:8px; }
  *{ scrollbar-width:thin; scrollbar-color:#D9C7A0 transparent; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; font-size:14px; }
  :focus-visible{ outline:2px solid var(--pine-500); outline-offset:2px; }
  a{ color:inherit; }
  h1,h2,h3,p{ margin:0; }

  .app{ height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* ===== Shared top bar ===== */
  .topbar{ height:56px; flex-shrink:0; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:16px; position:relative; }
  .topbar::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--rose-500) 0 16%, var(--amber-500) 16% 34%, var(--pine-500) 34% 54%, var(--purple-500) 54% 74%, var(--pink-500) 74% 100%); }
  .crumbs{ font-size:13px; color:var(--faint); display:flex; align-items:center; gap:8px; min-width:0; }
  .crumbs a{ display:flex; align-items:center; gap:5px; text-decoration:none; color:var(--muted); }
  .crumbs a:hover{ color:var(--pine-600); }
  .crumbs a svg{ width:14px; height:14px; }
  .crumbs .current{ color:var(--ink); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar-center{ display:flex; align-items:center; gap:14px; min-width:0; flex:1; }
  .topbar-title-input{ font-family:var(--font-display); font-weight:600; font-size:16px; border:none; background:transparent; color:var(--ink);
    padding:4px 6px; border-radius:5px; min-width:0; max-width:320px; }
  .status-badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.02em; flex-shrink:0; }
  .status-draft{ background:var(--line); color:var(--muted); }
  .status-published{ background:var(--pine-50); color:var(--pine-700); }
  .tabs{ display:flex; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:2px; flex-shrink:0; }
  .tab-btn{ padding:6px 14px; border-radius:5px; border:none; background:none; font-size:13px; color:var(--muted); font-weight:500; }
  .tab-btn.active{ background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .topbar-actions{ display:flex; gap:8px; flex-shrink:0; }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); font-size:13px; transition:border-color .15s, color .15s, background-color .15s, transform .15s, box-shadow .15s; white-space:nowrap; }
  .btn:hover{ border-color:var(--faint); color:var(--ink); transform:translateY(-1px); box-shadow:0 3px 10px rgba(43,33,22,.08); }
  .btn:active{ transform:translateY(0); box-shadow:none; }
  .btn-primary{ background:var(--pine-500); border-color:var(--pine-500); color:#fff; font-weight:600; }
  .btn-primary:hover{ background:var(--pine-600); border-color:var(--pine-600); color:#fff; box-shadow:0 4px 14px rgba(43,33,22,.28); }
  .btn-dark{ background:var(--pine-700); border-color:var(--pine-700); color:#fff; font-weight:600; }
  .btn-dark:hover{ background:var(--pine-600); border-color:var(--pine-600); box-shadow:0 4px 14px rgba(43,33,22,.28); }
  .btn-block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-lg{ padding:10px 18px; font-size:14px; border-radius:8px; }
  .btn-danger-text{ color:var(--rose-500); }
  .icon-only-btn{ padding:7px; }
  .icon-only-btn svg{ width:16px; height:16px; display:block; }

  /* ===== Dashboard ===== */
  .dash{ flex:1; overflow-y:auto; }
  .dash-inner{ max-width:1040px; margin:0 auto; padding:40px 32px 64px; }
  .dash-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; gap:16px; }
  .dash-title{ font-family:var(--font-display); font-weight:700; font-size:32px; letter-spacing:.01em; color:var(--ink); }
  .dash-sub{ font-size:14px; color:var(--muted); margin-top:6px; }
  .study-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
  .study-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; display:flex; flex-direction:column;
    gap:10px; cursor:pointer; transition:border-color .15s, box-shadow .2s, transform .2s; position:relative; box-shadow:0 1px 2px rgba(43,33,22,.04); }
  .study-card:hover{ border-color:var(--pine-300); box-shadow:0 10px 24px rgba(43,33,22,.1); transform:translateY(-3px); }
  .study-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .study-card-title{ font-size:15px; font-weight:600; color:var(--ink); line-height:1.35; }
  .study-card-desc{ font-size:13px; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .study-card-meta{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--faint); margin-top:auto; padding-top:8px; border-top:1px solid var(--line); }
  .study-card-menu{ position:relative; flex-shrink:0; }
  .kebab-btn{ padding:5px; border-radius:5px; background:none; border:none; color:var(--faint); display:flex; }
  .kebab-btn:hover{ background:var(--paper); color:var(--ink); }
  .kebab-btn svg{ width:16px; height:16px; }
  .menu-pop{ position:absolute; top:calc(100% + 4px); right:0; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 8px 24px rgba(43,33,22,.16); min-width:170px; z-index:30; padding:5px; animation:popIn .14s ease-out; }
  .menu-item{ display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border-radius:5px; background:none; border:none;
    font-size:13px; color:var(--ink); text-align:left; }
  .menu-item:hover{ background:var(--paper); }
  .menu-item svg{ width:14px; height:14px; color:var(--faint); flex-shrink:0; }
  .menu-item.danger{ color:var(--rose-500); }
  .menu-item.danger svg{ color:var(--rose-500); }
  .new-study-card{ border:1.5px dashed var(--line); border-radius:10px; padding:18px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; min-height:132px; background:none; color:var(--muted); transition:border-color .15s, background-color .15s, color .15s; }
  .new-study-card:hover{ border-color:var(--pine-500); color:var(--pine-600); background:var(--pine-50); }
  .new-study-card svg{ width:22px; height:22px; }
  .dash-empty{ text-align:center; padding:44px 20px 12px; color:var(--faint); font-size:13px; }
  .dash-empty svg{ width:56px; height:56px; margin:0 auto 14px; display:block; }

  /* ===== Builder layout ===== */
  .main{ flex:1; display:flex; min-height:0; }
  .sidebar-left{ width:264px; flex-shrink:0; border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; overflow:hidden; }
  .canvas{ flex:1; min-width:0; overflow-y:auto; }
  .sidebar-right{ width:300px; flex-shrink:0; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; }

  .add-actions{ padding:16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .add-actions-label{ font-size:12px; font-weight:500; color:var(--faint); margin-bottom:2px; }
  .add-btn{ position:relative; }
  .add-btn-main{ width:100%; display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:8px; border:1.5px solid var(--pine-500);
    background:var(--pine-50); color:var(--pine-700); font-size:13px; font-weight:600; transition:background-color .15s, transform .15s; }
  .add-btn-main:hover{ background:var(--pine-100); transform:translateY(-1px); }
  .add-btn-main.alt{ border-color:var(--amber-500); background:var(--amber-100); color:var(--amber-600); }
  .add-btn-main.alt:hover{ background:#F5DFA8; }
  .add-btn-main svg{ width:16px; height:16px; flex-shrink:0; }
  .add-btn-main .grow{ flex:1; text-align:left; }
  .add-menu{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; box-shadow:0 10px 28px rgba(0,0,0,.14); z-index:30; padding:6px; }
  .add-menu-item{ display:flex; align-items:flex-start; gap:10px; width:100%; padding:8px 9px; border-radius:6px; background:none; border:none; text-align:left; }
  .add-menu-item:hover{ background:var(--paper); }
  .add-menu-icon{ width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .add-menu-icon svg{ width:13px; height:13px; }
  .add-menu-title{ font-size:13px; font-weight:500; color:var(--ink); }
  .add-menu-desc{ font-size:11.5px; color:var(--faint); line-height:1.35; margin-top:1px; }

  .lib-scroll{ flex:1; overflow-y:auto; padding:14px 16px; }
  .lib-group-label{ font-size:12px; font-weight:500; color:var(--faint); margin-bottom:6px; }
  .lib-item{ width:100%; display:flex; align-items:center; gap:10px; padding:8px; border-radius:6px; background:none; border:1px solid transparent;
    text-align:left; transition:background-color .15s; margin-bottom:2px; }
  .lib-item:hover{ background:var(--paper); }
  .lib-icon{ width:26px; height:26px; border-radius:6px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }
  .lib-icon svg{ width:13px; height:13px; }
  .lib-title{ font-size:13px; color:var(--ink); }
  .lib-footer{ padding:12px 16px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); line-height:1.5; }

  /* Group tint modifiers — a subtle way-finding accent per block category, used as
     accents on icon chips only (not fills), so the canvas stays calm overall. */
  .icon-tint-task{ background:var(--pine-50); color:var(--pine-600); }
  .icon-tint-question{ background:var(--amber-100); color:var(--amber-600); }
  .icon-tint-structure{ background:var(--purple-50); color:var(--purple-500); }

  .canvas-inner{ max-width:720px; margin:0 auto; padding:32px; }
  .study-title{ font-family:var(--font-display); font-weight:600; font-size:26px; width:100%; background:transparent; border:none; padding:2px 4px;
    margin-left:-4px; margin-bottom:6px; color:var(--ink); border-radius:4px; }
  .study-desc{ width:100%; background:transparent; border:none; resize:none; font-size:14px; color:var(--muted); padding:2px 4px;
    margin-left:-4px; margin-bottom:22px; border-radius:4px; font-family:inherit; }
  .flow{ display:flex; flex-direction:column; gap:10px; }

  .block-card{ background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:14px 16px; cursor:pointer;
    transition:border-color .15s, box-shadow .2s, transform .15s; }
  .block-card:hover{ border-color:var(--faint); transform:translateY(-1px); box-shadow:0 6px 16px rgba(43,33,22,.07); }
  .block-card.selected{ border-color:var(--pine-500); box-shadow:0 0 0 1px var(--pine-500); }
  .block-card.drag-over{ box-shadow:inset 0 2px 0 0 var(--pine-500); }
  .block-row{ display:flex; align-items:center; gap:12px; }
  .grip{ color:var(--faint); flex-shrink:0; cursor:grab; display:flex; }
  .grip svg{ width:16px; height:16px; }
  .num-badge{ width:24px; height:24px; border-radius:999px; background:var(--paper); border:1px solid var(--line); font-size:11px;
    font-weight:500; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .block-icon{ width:32px; height:32px; border-radius:7px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }
  .block-icon svg{ width:16px; height:16px; }
  .block-meta{ min-width:0; flex:1; }
  .block-title{ font-size:14px; font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .block-summary{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; display:flex; align-items:center; gap:5px; }
  .block-summary svg{ width:13px; height:13px; flex-shrink:0; }
  .block-actions{ display:flex; align-items:center; gap:1px; flex-shrink:0; opacity:0; transition:opacity .15s; }
  .block-card:hover .block-actions{ opacity:1; }
  .icon-btn{ padding:6px; border-radius:5px; background:none; border:none; color:var(--faint); display:flex; }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn:hover{ background:var(--paper); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--rose-100); color:var(--rose-500); }
  .icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .icon-btn:disabled:hover{ background:none; color:var(--faint); }

  .empty-flow{ border:1.5px dashed var(--line); border-radius:10px; padding:44px 20px; text-align:center; font-size:13px; color:var(--faint); }
  .empty-flow svg{ width:48px; height:48px; margin:0 auto 12px; display:block; }

  /* ===== Right panel ===== */
  .panel-header{ display:flex; align-items:center; gap:10px; padding:18px 20px 15px; border-bottom:1px solid var(--line); }
  .panel-header-text{ min-width:0; }
  .panel-header-title{ font-size:14px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel-header-sub{ font-size:12px; color:var(--faint); }
  .panel-body{ padding:18px 20px; }
  .overview-card{ border:1px solid var(--line); border-radius:8px; padding:15px; margin-bottom:16px; }
  .overview-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:7px; }
  .overview-row:last-child{ margin-bottom:0; }
  .overview-row .k{ color:var(--muted); }
  .overview-row .v{ color:var(--ink); font-weight:500; }
  .hint-text{ font-size:13px; color:var(--muted); line-height:1.55; }

  /* Theme colour picker — an "art app" style H/S/L mixer for the study's accent colour */
  .theme-picker{ border:1px solid var(--line); border-radius:8px; padding:15px; margin-bottom:16px; }
  .theme-picker-label{ font-size:13px; font-weight:500; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .theme-picker-label svg{ width:14px; height:14px; color:var(--faint); }
  .theme-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .theme-swatch{ width:34px; height:34px; border-radius:8px; border:1px solid var(--line); flex-shrink:0; box-shadow:inset 0 0 0 2px var(--panel); }
  .theme-hex{ flex:1; font-family:'Public Sans', monospace; text-transform:uppercase; letter-spacing:.02em; }
  .theme-slider-group{ margin-bottom:10px; }
  .theme-slider-group:last-of-type{ margin-bottom:12px; }
  .theme-slider-label{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint); margin-bottom:4px; }
  .theme-slider{ -webkit-appearance:none; appearance:none; width:100%; height:14px; border-radius:999px; outline:none; border:1px solid rgba(0,0,0,.08); cursor:pointer; }
  .theme-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:999px; background:#fff;
    border:2px solid var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.3); cursor:grab; margin-top:-2px; }
  .theme-slider::-moz-range-thumb{ width:18px; height:18px; border-radius:999px; background:#fff; border:2px solid var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.3); cursor:grab; }
  .theme-slider::-moz-range-track{ height:14px; border-radius:999px; }
  .theme-presets{ display:flex; gap:7px; flex-wrap:wrap; }
  .theme-preset-swatch{ width:22px; height:22px; border-radius:999px; border:1px solid rgba(0,0,0,.12); padding:0; transition:transform .12s; }
  .theme-preset-swatch:hover{ transform:scale(1.15); }
  .theme-reset-link{ font-size:12px; color:var(--muted); background:none; border:none; padding:0 0 0 4px; text-decoration:underline; align-self:center; }
  .theme-reset-link:hover{ color:var(--ink); }

  .field{ margin-bottom:16px; }
  .field-label{ font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px; }
  .field-hint{ font-size:12px; color:var(--faint); margin-top:6px; line-height:1.4; }
  .input, .textarea, .select{ width:100%; padding:8px 11px; font-size:14px; background:var(--paper); border:1px solid var(--line);
    border-radius:6px; color:var(--ink); }
  .textarea{ resize:none; font-family:inherit; }
  .input::placeholder, .textarea::placeholder{ color:var(--faint); }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .seg{ display:flex; gap:8px; }
  .seg-btn{ flex:1; padding:9px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); font-size:13px;
    color:var(--muted); text-transform:capitalize; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .seg-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .seg-btn.active{ border-color:var(--pine-500); background:var(--pine-50); color:var(--pine-700); font-weight:500; }
  .toggle-row{ display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; }
  .toggle-track{ width:36px; height:20px; border-radius:999px; background:var(--line); position:relative; transition:background-color .15s; flex-shrink:0; }
  .toggle-track.on{ background:var(--pine-500); }
  .toggle-thumb{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px; background:#fff; transition:transform .15s; }
  .toggle-track.on .toggle-thumb{ transform:translateX(16px); }
  .toggle-label{ font-size:13px; color:var(--ink); }
  .note-box{ font-size:13px; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:11px 13px; line-height:1.55; }
  .demo-field{ border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; }
  .demo-field-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .demo-type-row{ display:flex; gap:6px; margin-bottom:8px; }
  .demo-type-btn{ padding:5px 10px; border-radius:5px; border:1px solid var(--line); background:var(--panel); font-size:12px; color:var(--muted); text-transform:capitalize; }
  .demo-type-btn.active{ border-color:var(--pine-500); background:var(--pine-50); color:var(--pine-700); }
  .add-field-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px; border-radius:6px;
    border:1px dashed var(--line); background:none; font-size:13px; color:var(--muted); }
  .add-field-btn:hover{ border-color:var(--faint); color:var(--ink); }
  .add-field-btn svg{ width:14px; height:14px; }

  /* ===== Preview / take overlay ===== */
  .preview-overlay{ position:fixed; inset:0; background:var(--paper); z-index:40; display:flex; flex-direction:column; }
  .preview-progress{ height:3px; background:var(--line); flex-shrink:0; }

/* =========================================================================
   COLOUR THEMING — light/dark mode, and a per-study accent colour that
   researchers can mix with H/S/L sliders (like an art app's colour picker).
   ========================================================================= */
const DEFAULT_THEME_HEX = "#0E7C7B"; // the original peacock teal brand colour

function hexToHSL(hex) {
  hex = (hex || "").replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  const r = parseInt(hex.slice(0, 2), 16) / 255;
  const g = parseInt(hex.slice(2, 4), 16) / 255;
  const b = parseInt(hex.slice(4, 6), 16) / 255;
  if ([r, g, b].some(isNaN)) return { h: 178, s: 79, l: 27 }; // fallback ~ default teal
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
  }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(100, s)) / 100; l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
  const rr = Math.max(0, Math.min(255, Math.round((r + m) * 255)));
  const gg = Math.max(0, Math.min(255, Math.round((g + m) * 255)));
  const bb = Math.max(0, Math.min(255, Math.round((b + m) * 255)));
  return "#" + [rr, gg, bb].map(v => v.toString(16).padStart(2, "0")).join("");
}
/* Builds the 50/100/300/500/600/700 scale used throughout the UI (buttons,
   active tabs, focus rings, progress bars, icon chips) from one base colour.
   Whatever lightness the researcher picks becomes exactly the "500" — the
   solid button colour — lighter tints and darker shades are derived from it. */
function generateShadeScale(hex) {
  const { h, s } = hexToHSL(hex);
  const baseL = hexToHSL(hex).l;
  return {
    50: hslToHex(h, Math.max(s * 0.55, 12), 93),
    100: hslToHex(h, Math.max(s * 0.65, 18), 85),
    300: hslToHex(h, s, 60),
    500: hex,
    600: hslToHex(h, s, Math.max(baseL - 10, 8)),
    700: hslToHex(h, s, Math.max(baseL - 20, 5))
  };
}
function applyThemeColor(hex) {
  const scale = generateShadeScale(hex || DEFAULT_THEME_HEX);
  const root = document.documentElement.style;
  root.setProperty("--pine-50", scale[50]);
  root.setProperty("--pine-100", scale[100]);
  root.setProperty("--pine-300", scale[300]);
  root.setProperty("--pine-500", scale[500]);
  root.setProperty("--pine-600", scale[600]);
  root.setProperty("--pine-700", scale[700]);
}

/* Background colour override. Unlike the accent scale (which is harmless to
   always set, since dark mode never touches --pine-*), the neutral surface
   tokens here are exactly what dark mode also controls — so we only ever set
   these inline when a study has an explicit custom background, and remove
   the inline override entirely otherwise, so the dark/light toggle keeps
   working normally for every study that hasn't customised its background. */
const DEFAULT_BG_HEX = "#F7EFDF"; // the original warm-ivory paper colour
const BG_TOKENS = ["--paper", "--panel", "--line", "--ink", "--muted", "--faint"];

function computeBackgroundTokens(hex) {
  const { h, s, l } = hexToHSL(hex);
  const isDark = l < 55;
  const paper = hex;
  const panel = hslToHex(h, Math.max(s * 0.45, 4), isDark ? Math.min(l + 7, 92) : Math.min(l + 6, 99));
  const line = hslToHex(h, Math.max(s * 0.4, 6), isDark ? Math.min(l + 20, 88) : Math.max(l - 20, 6));
  return {
    paper, panel, line,
    ink: isDark ? "#F2E8D6" : "#2B2116",
    muted: isDark ? "#C6B392" : "#7A6C55",
    faint: isDark ? "#8C7A5C" : "#A99A7C"
  };
}
function applyBackgroundColor(hex) {
  const tokens = computeBackgroundTokens(hex);
  const root = document.documentElement.style;
  root.setProperty("--paper", tokens.paper);
  root.setProperty("--panel", tokens.panel);
  root.setProperty("--line", tokens.line);
  root.setProperty("--ink", tokens.ink);
  root.setProperty("--muted", tokens.muted);
  root.setProperty("--faint", tokens.faint);
}
function clearBackgroundOverride() {
  const root = document.documentElement.style;
  BG_TOKENS.forEach(t => root.removeProperty(t));
}

}

  if (!values || values.some(v => v == null)) return null;
  let total = 0;
  values.forEach((v, i) => { total += ((i + 1) % 2 !== 0) ? (v - 1) : (5 - v); });
  return total * 2.5;
}

/* =========================================================================
   PERSISTENCE — studies live in localStorage so the dashboard, publish
   links and results survive a page reload, like a lightweight backend.
   ========================================================================= */
const STORAGE_KEY = "researchkit:data:v1";
let memoryFallback = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* storage unavailable — fall back to memory */ }
  if (memoryFallback) return memoryFallback;
  return seedData();
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { memoryFallback = data; }
}
function makeBlock(type) { return { id: uid(), type, config: BLOCK_REGISTRY[type].defaultConfig() }; }
function seedData() {
  const study = {
    id: uid(),
    title: "Checkout flow — usability study",
    description: "Unmoderated study testing the redesigned checkout prototype.",
    status: "draft",
    acceptingResponses: true,
    themeColor: DEFAULT_THEME_HEX,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    blocks: [
      makeBlock("welcome"), makeBlock("task"), makeBlock("seq"),
      makeBlock("demographics"), makeBlock("sus"), makeBlock("openended"), makeBlock("thankyou")
    ],
    responses: []
  };
  const data = { studies: {}, order: [study.id] };
  data.studies[study.id] = study;
  saveData(data);
  return data;
}

const db = loadData();
function persist() {
  if (!db.order) return;
  saveData(db);
  try { lastRawSnapshot = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  scheduleSync();
}

/* Keep this tab's view of the data fresh when a response (or edit) is saved
   from another tab/window — e.g. a participant completing the study via the
   published link in a separate tab while the admin has Results open here.
   We listen for the 'storage' event (fires in other same-origin tabs),
   refresh on tab focus, and fall back to light polling for reliability. */
let lastRawSnapshot = (() => { try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; } })();
function refreshFromStorageIfChanged() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
  if (raw == null || raw === lastRawSnapshot) return;
  lastRawSnapshot = raw;
  try {
    const fresh = JSON.parse(raw);
    db.studies = fresh.studies;
    db.order = fresh.order;
    render();
  } catch (e) { /* ignore malformed snapshot */ }
}
window.addEventListener("storage", (e) => { if (!e.key || e.key === STORAGE_KEY) refreshFromStorageIfChanged(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshFromStorageIfChanged(); });
setInterval(refreshFromStorageIfChanged, 1500);

/* =========================================================================
   SYNC — optional Google Sheets backend (via a tiny Google Apps Script web
   app the researcher deploys once). Makes published links work for anyone,
   on any device, and brings responses back into Results.
   Sheets used: "Studies" (published study JSON) and "Responses".
   ========================================================================= */
const SYNC_KEY = "researchkit:sync";
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch (e) { return null; } })();
function saveSync() { try { if (sync) localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); else localStorage.removeItem(SYNC_KEY); } catch (e) {} }
const syncState = { hash: {}, status: {}, remote: {}, resp: {}, timer: null };
function genAdminKey() {
  const a = new Uint8Array(18);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random() * 256));
  return Array.from(a, b => b.toString(36).padStart(2, "0")).join("").slice(0, 24);
}
function appsScriptCode(key) {
  return `// ResearchKit backend — paste into script.google.com (Extensions > Apps Script) from a Google Sheet
const KEY = '${key}';
function sh_(n, h) { const ss = SpreadsheetApp.getActiveSpreadsheet(); let s = ss.getSheetByName(n); if (!s) { s = ss.insertSheet(n); s.appendRow(h); } return s; }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function studyRow_(id) {
  const rows = sh_('Studies', ['id', 'json', 'updatedAt']).getDataRange().getValues();
  for (let i = 1; i < rows.length; i++) if (String(rows[i][0]) === id) return { row: i + 1, study: JSON.parse(rows[i][1]) };
  return null;
}
function doGet(e) {
  const p = e.parameter;
  if (p.action === 'ping') return out_({ ok: true });
  if (p.action === 'study') { const r = studyRow_(p.id); return out_(r ? { ok: true, study: r.study } : { ok: false, error: 'not_found' }); }
  if (p.action === 'responses') {
    if (p.key !== KEY) return out_({ ok: false, error: 'forbidden' });
    const rows = sh_('Responses', ['studyId', 'responseId', 'submittedAt', 'json']).getDataRange().getValues();
    const list = [];
    for (let i = 1; i < rows.length; i++) if (String(rows[i][0]) === p.id) list.push(JSON.parse(rows[i][3]));
    return out_({ ok: true, responses: list });
  }
  return out_({ ok: false, error: 'bad_action' });
}
function doPost(e) {
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.action === 'publish') {
      if (d.key !== KEY) return out_({ ok: false, error: 'forbidden' });
      const json = JSON.stringify(d.study);
      if (json.length > 49000) return out_({ ok: false, error: 'study_too_large' });
      const s = sh_('Studies', ['id', 'json', 'updatedAt']); const r = studyRow_(d.study.id);
      if (r) s.getRange(r.row, 1, 1, 3).setValues([[d.study.id, json, new Date()]]); else s.appendRow([d.study.id, json, new Date()]);
      return out_({ ok: true });
    }
    if (d.action === 'submit') {
      const r = studyRow_(d.id);
      if (!r || r.study.status !== 'published') return out_({ ok: false, error: 'not_found' });
      if (!r.study.acceptingResponses) return out_({ ok: false, error: 'closed' });
      const s = sh_('Responses', ['studyId', 'responseId', 'submittedAt', 'json']);
      const rows = s.getDataRange().getValues();
      for (let i = 1; i < rows.length; i++) if (String(rows[i][1]) === d.response.id) return out_({ ok: true, duplicate: true });
      s.appendRow([d.id, d.response.id, new Date(d.response.submittedAt), JSON.stringify(d.response)]);
      return out_({ ok: true });
    }
    return out_({ ok: false, error: 'bad_action' });
  } finally { lock.releaseLock(); }
}`;
}
async function apiGet(url, params) {
  const u = new URL(url);
  Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
  const r = await fetch(u.toString());
  return r.json();
}
async function apiPost(url, body) {
  const text = JSON.stringify(body);
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: text });
    return await r.json();
  } catch (e) {
    // Some browsers refuse to expose the redirected Apps Script reply; the write still lands.
    await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: text });
    return { ok: true, opaque: true };
  }
}
function studyForSync(study) {
  const c = JSON.parse(JSON.stringify(study));
  delete c.responses;
  return c;
}
function studyHash(study) { return JSON.stringify(studyForSync(study).blocks) + "|" + [study.title, study.description, study.status, study.acceptingResponses, study.themeColor, study.bgColor].join("|"); }
function syncErrorText(code) {
  return ({ forbidden: "The admin key doesn't match. Re-copy the script from Sharing setup and redeploy it.",
    study_too_large: "This study is too big for one sheet cell (50k characters). Shorten some text.",
    not_found: "Study not found in the sheet.", closed: "This study has stopped accepting responses." })[code] || ("Sync problem: " + code);
}
async function pushStudy(study, force) {
  if (!sync || !sync.url || study.status !== "published") return;
  const h = studyHash(study);
  if (!force && syncState.hash[study.id] === h) return;
  syncState.hash[study.id] = h;
  syncState.status[study.id] = { state: "syncing" };
  render();
  try {
    const r = await apiPost(sync.url, { action: "publish", key: sync.key, study: studyForSync(study) });
    syncState.status[study.id] = r.ok ? { state: "ok", t: Date.now() } : { state: "error", msg: syncErrorText(r.error) };
    if (!r.ok) delete syncState.hash[study.id];
  } catch (e) {
    syncState.status[study.id] = { state: "error", msg: "Couldn't reach Google Sheets. Check your connection and the web app URL." };
    delete syncState.hash[study.id];
  }
  render();
}
function syncPushDirty() {
  if (!sync || !sync.url) return;
  db.order.forEach(id => { const st = db.studies[id]; if (st) pushStudy(st, false); });
}
function scheduleSync() {
  if (!sync || !sync.url) return;
  clearTimeout(syncState.timer);
  syncState.timer = setTimeout(syncPushDirty, 900);
}
function getRemoteStudy(id, api) {
  let st = syncState.remote[id];
  if (st) return st;
  st = syncState.remote[id] = { state: "loading" };
  apiGet(api, { action: "study", id }).then(r => {
    if (r.ok && r.study) { r.study.responses = []; syncState.remote[id] = { state: "ready", study: r.study }; }
    else syncState.remote[id] = { state: "error", error: r.error || "not_found" };
  }).catch(() => { syncState.remote[id] = { state: "error", error: "network" }; }).then(() => render());
  return st;
}
function fetchResponses(id, force) {
  if (!sync || !sync.url) return;
  const study = db.studies[id];
  if (!study || study.status !== "published") return;
  const st = syncState.resp[id] || (syncState.resp[id] = { list: [], t: 0, loading: false, error: null });
  if (st.loading || (!force && Date.now() - st.t < 8000)) return;
  st.loading = true;
  apiGet(sync.url, { action: "responses", id, key: sync.key })
    .then(r => { if (r.ok) { st.list = r.responses || []; st.error = null; } else st.error = syncErrorText(r.error); })
    .catch(() => { st.error = "Couldn't reach Google Sheets."; })
    .then(() => { st.loading = false; st.t = Date.now(); render(); });
}
function getResponses(study) {
  const local = study.responses || [];
  const st = syncState.resp[study.id];
  if (!st || !st.list.length) return local;
  const seen = new Set(local.map(r => r.id));
  return local.concat(st.list.filter(r => !seen.has(r.id)));
}
setInterval(() => {
  if (!sync || !sync.url) return;
  const r = parseRoute();
  if (r.view === "results") fetchResponses(r.id, false);
  else if (r.view === "dashboard") db.order.forEach(id => fetchResponses(id, false));
}, 10000);

/* =========================================================================
   ROUTER
   ========================================================================= */
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  const qi = raw.indexOf("?");
  const h = qi >= 0 ? raw.slice(0, qi) : raw;
  let api = null;
  if (qi >= 0) { try { api = new URLSearchParams(raw.slice(qi + 1)).get("api"); } catch (e) {} }
  const parts = h.split("/").filter(Boolean);
  if (parts[0] === "study" && parts[1] && parts[2] === "edit") return { view: "edit", id: parts[1] };
  if (parts[0] === "study" && parts[1] && parts[2] === "results") return { view: "results", id: parts[1] };
  if (parts[0] === "take" && parts[1]) return { view: "take", id: parts[1], api };
  return { view: "dashboard" };
}
function navigate(hash) { location.hash = hash; }

/* transient UI state (not persisted) */
const ui = {
  selectedBlockId: null,
  openMenu: null,        // 'task' | 'question' | studyId (kebab menu) | null
  publishModal: null,    // studyId when open
  copied: false,
  resultsTab: "summary",
  take: null,            // { step, responses, finished, modalConfig }
  themeHSLDraft: null,    // { studyId, h, s, l } — live precision while dragging the accent sliders
  bgHSLDraft: null,        // same, for the background colour picker
  newStudyModal: false,
  syncModal: false, syncUrlDraft: null, syncKeyDraft: null, syncMsg: null, scriptCopied: false
};

/* =========================================================================
   RENDER — router entry point
   ========================================================================= */
const root = document.getElementById("root");

function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.dataset || !el.dataset.focusId) return null;
  return { id: el.dataset.focusId, start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocus(info) {
  if (!info) return;
  const el = root.querySelector(`[data-focus-id="${info.id}"]`);
  if (!el) return;
  el.focus();
  if (typeof info.start === "number" && el.setSelectionRange) {
    try { el.setSelectionRange(info.start, info.end); } catch (e) {}
  }
}

function render() {
  const focusInfo = captureFocus();
  const route = parseRoute();

  if (route.view === "take") {
    let study;
    if (route.api) {
      const st = getRemoteStudy(route.id, route.api);
      if (st.state === "loading") { root.innerHTML = `<div class="app"><div class="closed-notice">${icon("inbox","")}<h2>Loading study…</h2></div></div>`; return; }
      if (st.state === "error") { root.innerHTML = `<div class="app"><div class="closed-notice">${icon("inbox","")}<h2>${st.error === "network" ? "Couldn't load this study" : "Study not found"}</h2><p>${st.error === "network" ? "Check your internet connection and reload the page." : "This link may be wrong or the study hasn't been published yet."}</p></div></div>`; return; }
      study = st.study;
    } else study = db.studies[route.id];
    applyThemeColor(study ? study.themeColor : DEFAULT_THEME_HEX);
    if (study && study.bgColor) applyBackgroundColor(study.bgColor); else clearBackgroundOverride();
    root.innerHTML = renderTake(study, route.id);
  } else if (route.view === "edit" && db.studies[route.id]) {
    applyThemeColor(db.studies[route.id].themeColor);
    if (db.studies[route.id].bgColor) applyBackgroundColor(db.studies[route.id].bgColor); else clearBackgroundOverride();
    root.innerHTML = renderStudioShell(db.studies[route.id], "edit");
  } else if (route.view === "results" && db.studies[route.id]) {
    applyThemeColor(db.studies[route.id].themeColor);
    if (db.studies[route.id].bgColor) applyBackgroundColor(db.studies[route.id].bgColor); else clearBackgroundOverride();
    root.innerHTML = renderStudioShell(db.studies[route.id], "results");
  } else {
    applyThemeColor(DEFAULT_THEME_HEX);
    clearBackgroundOverride();
    root.innerHTML = renderDashboard();
  }
  restoreFocus(focusInfo);
  if (sync && sync.url) {
    if (route.view === "results") fetchResponses(route.id, false);
    else if (route.view === "dashboard") db.order.forEach(id => fetchResponses(id, false));
  }
}
window.addEventListener("hashchange", render);
applyColorScheme(loadColorScheme());

/* Generic H/S/L "art app" mixer — used for both the button/accent colour
   and the background colour pickers below, parametrised by an action prefix
   so both can be driven by the same slider/hex/preset event handlers pattern. */
function renderColorPicker({ prefix, labelText, iconName, hex, presets, showReset }) {
  const { h, s, l } = hexToHSL(hex);
  const hueBg = `linear-gradient(to right, hsl(0,${s}%,${l}%), hsl(60,${s}%,${l}%), hsl(120,${s}%,${l}%), hsl(180,${s}%,${l}%), hsl(240,${s}%,${l}%), hsl(300,${s}%,${l}%), hsl(360,${s}%,${l}%))`;
  const satBg = `linear-gradient(to right, hsl(${h},0%,${l}%), hsl(${h},100%,${l}%))`;
  const lightBg = `linear-gradient(to right, hsl(${h},${s}%,0%), hsl(${h},${s}%,50%), hsl(${h},${s}%,100%))`;
  return `
    <div class="theme-picker" data-stop="1">
      <div class="theme-picker-label">${icon(iconName,"")} ${esc(labelText)}</div>
      <div class="theme-row">
        <span class="theme-swatch" data-role="${prefix}-swatch" style="background:${hex};"></span>
        <input class="input theme-hex" data-action="${prefix}-hex-input" data-role="${prefix}-hex" data-focus-id="${prefix}-hex" value="${esc(hex)}" maxlength="7" spellcheck="false"/>
      </div>
      <div class="theme-slider-group">
        <div class="theme-slider-label"><span>Hue</span><span data-role="${prefix}-h-val">${h}</span></div>
        <input type="range" class="theme-slider" data-action="${prefix}-h" data-role="${prefix}-h" min="0" max="360" value="${h}" style="background:${hueBg};"/>
      </div>
      <div class="theme-slider-group">
        <div class="theme-slider-label"><span>Saturation</span><span data-role="${prefix}-s-val">${s}%</span></div>
        <input type="range" class="theme-slider" data-action="${prefix}-s" data-role="${prefix}-s" min="0" max="100" value="${s}" style="background:${satBg};"/>
      </div>
      <div class="theme-slider-group">
        <div class="theme-slider-label"><span>Lightness</span><span data-role="${prefix}-l-val">${l}%</span></div>
        <input type="range" class="theme-slider" data-action="${prefix}-l" data-role="${prefix}-l" min="0" max="100" value="${l}" style="background:${lightBg};"/>
      </div>
      <div class="theme-presets">
        ${presets.map(p => `<button type="button" class="theme-preset-swatch" data-action="${prefix}-preset" data-hex="${p}" style="background:${p};" title="${p}"></button>`).join("")}
        ${showReset ? `<button type="button" class="theme-reset-link" data-action="bg-reset">Reset</button>` : ""}
      </div>
    </div>`;
}

/* Figma sets anti-embedding headers on its normal /proto/ and /design/ pages
   (to block clickjacking), but publishes a dedicated embeddable URL format
   for exactly this use case. Rewrite Figma links to that format automatically
   so they load inside the in-page modal instead of failing silently.

   We also inject two of Figma's own prototype view parameters so the design
   isn't fighting Figma's presentation chrome for space inside our frame:
     - hide-ui=1        hides Figma's toolbar, footer, and comments sidebar
     - scaling=scale-down  scales the frame down to fit without cropping,
                           instead of sitting centered with padding
   Either is skipped if the pasted link already specifies its own value,
   so an intentional choice (e.g. a specific starting frame's scaling) is
   never silently overridden. */
function withFigmaViewParams(urlObj) {
  if (!urlObj.searchParams.has("hide-ui")) urlObj.searchParams.set("hide-ui", "1");
  if (!urlObj.searchParams.has("scaling")) urlObj.searchParams.set("scaling", "scale-down");
  return urlObj;
}
function toEmbeddableUrl(rawUrl) {
  if (!rawUrl) return rawUrl;
  let u;
  try { u = new URL(rawUrl); } catch (e) { return rawUrl; } // not a valid absolute URL — leave as-is
  const host = u.hostname.toLowerCase();
  if (host !== "figma.com" && !host.endsWith(".figma.com")) return rawUrl; // not a Figma link at all

  if (host === "embed.figma.com") {
    // Already Figma's direct embeddable host (what their own "Embed" code
    // generates) — just make sure the view params are set.
    return withFigmaViewParams(u).toString();
  }
  if (u.pathname === "/embed") {
    // Already wrapped as figma.com/embed?embed_host=...&url=<inner> —
    // apply the view params to the inner prototype link, not the wrapper.
    const inner = u.searchParams.get("url");
    if (inner) {
      try {
        const innerUrl = withFigmaViewParams(new URL(inner));
        u.searchParams.set("url", innerUrl.toString());
      } catch (e) { /* inner wasn't a valid absolute URL — leave wrapper untouched */ }
    }
    return u.toString();
  }
  if (/^\/(proto|design|file)\//.test(u.pathname)) {
    // A normal share link — add the view params, then wrap it for embedding.
    withFigmaViewParams(u);
    return "https://www.figma.com/embed?embed_host=share&url=" + encodeURIComponent(u.toString());
  }
  return rawUrl;
}
/* Pulls the src="..." URL out of a pasted <iframe> embed snippet. We deliberately
   don't inject the pasted markup as-is — tools like Figma hard-code a fixed
   width/height on their snippet, which fights with our own frame sizing and is
   exactly what made the preview render too small/cropped. Extracting just the
   link and dropping it into our own iframe keeps sizing fully under our control,
   the same way plain URL mode already works. */
function extractSrcFromEmbed(html) {
  if (!html) return "";
  const match = html.match(/src\s*=\s*["']([^"']+)["']/i);
  return match ? match[1] : "";
}

function renderModal(config) {
  const isMobile = config.deviceType === "mobile";
  const isEmbed = config.sourceType === "embed";
  const rawUrl = config.prototypeUrl || "";
  const embedSrc = isEmbed ? extractSrcFromEmbed(config.embedCode) : "";
  const effectiveUrl = isEmbed ? embedSrc : rawUrl;
  const domain = effectiveUrl
    ? effectiveUrl.replace(/^https?:\/\//, "").split("/")[0]
    : (isEmbed ? "Embed code" : "No URL set");
  const head = isMobile
    ? `<div class="modal-head chrome-mobile"><span class="mobile-notch"></span><button data-action="close-modal">${icon("x","")}</button></div>`
    : `<div class="modal-head">
         <span class="chrome-dots"><span class="chrome-dot red"></span><span class="chrome-dot yellow"></span><span class="chrome-dot green"></span></span>
         <span class="chrome-url">${esc(domain)}</span>
         <button data-action="close-modal">${icon("x","")}</button>
       </div>`;
  let bodyHTML;
  if (effectiveUrl) {
    bodyHTML = `<iframe src="${esc(toEmbeddableUrl(effectiveUrl))}" title="Prototype"></iframe>`;
  } else if (isEmbed && config.embedCode) {
    bodyHTML = `<div class="modal-empty">Couldn't find a link inside that embed code — double-check it includes a src="..." attribute.</div>`;
  } else {
    bodyHTML = `<div class="modal-empty">No prototype ${isEmbed ? "embed code" : "URL"} configured for this task.</div>`;
  }
  return `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal-box ${isMobile ? "device-mobile" : "device-web"}" data-stop="1">
        ${head}
        <div class="modal-body">${bodyHTML}</div>
        ${effectiveUrl ? `<div class="modal-fallback">Trouble loading? <a href="${esc(effectiveUrl)}" target="_blank" rel="noopener">Open in a new tab${icon("external","")}</a></div>` : ""}
      </div>
    </div>`;
}

/* =========================================================================
   TAKE — the public participant-facing flow reached via the share link.
   Completing it saves a real response into the study's results.
   ========================================================================= */
function renderTake(study, id) {
  if (!study) {
    return `<div class="app"><div class="closed-notice">${icon("inbox","")}<h2>Study not found</h2><p>This link doesn't match a study on this device.</p></div></div>`;
  }
  if (!study.acceptingResponses || study.status !== "published") {
    return `<div class="app"><div class="closed-notice">${icon("inbox","")}<h2>Not accepting responses</h2><p>This study isn't currently open to participants. Please check back later.</p></div></div>`;
  }
  if (!ui.take || ui.take.studyId !== id) {
    ui.take = { studyId: id, step: 0, responses: {}, finished: false, modalConfig: null };
  }
  const p = ui.take;
  const blocks = study.blocks;

  if (p.finished) {
    return `
      <div class="app">
        <div class="closed-notice">
          <div class="thankyou-icon" style="margin:0 auto 16px;">${icon("checkCircle","")}</div>
          ${p.submitState === "sending" ? `<h2>Sending your answers…</h2><p>Please keep this page open.</p>`
            : p.submitState === "error" ? `<h2>Couldn't send your answers</h2><p>${esc(p.submitError || "Something went wrong.")}</p><button class="btn btn-primary" style="margin-top:12px;" data-action="retry-submit">Try again</button>`
            : `<h2>Response recorded</h2><p>Thanks for taking part — your answers have been submitted.</p>`}
        </div>
      </div>`;
  }
  const current = blocks[p.step];
  if (!current) { p.finished = true; return renderTake(study, id); }
  const meta = BLOCK_REGISTRY[current.type];
  const value = p.responses[current.id];
  const progress = Math.round((p.step / blocks.length) * 100);
  return `
    <div class="app">
      <div class="preview-progress"><div class="preview-progress-bar" style="width:${progress}%"></div></div>
      <div class="preview-body" style="padding-top:56px;">${meta.runHTML(current.config, value)}</div>
      ${p.modalConfig ? renderModal(p.modalConfig) : ""}
    </div>`;
}

/* =========================================================================
   RESULTS
   ========================================================================= */
function computeSummary(study) {
  const responses = getResponses(study);
  const susBlock = study.blocks.find(b => b.type === "sus");
  const susScores = susBlock ? responses.map(r => scoreSUS(r.answers[susBlock.id])).filter(v => v != null) : [];
  const susAvg = susScores.length ? susScores.reduce((a,b)=>a+b,0) / susScores.length : null;
  return { count: responses.length, susAvg, susGrade: susGrade(susAvg) };
}

function renderResultsSyncBar(study) {
  if (study.status !== "published") return "";
  if (!sync || !sync.url) return `<div class="warn-box">Responses from other people only appear here once sharing is set up. <div class="sync-row"><button class="btn btn-primary" data-action="open-sync">Set up sharing</button></div></div>`;
  const st = syncState.resp[study.id] || {};
  const when = st.t ? new Date(st.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : null;
  const label = st.error ? `<span style="color:var(--rose-500)">${esc(st.error)}</span>` : st.loading && !when ? "Loading from Google Sheets…" : when ? "Synced with Google Sheets · updated " + when : "Connecting…";
  return `<div class="sync-status"><span>${label}</span><button class="btn" data-action="refresh-results" data-id="${study.id}">${st.loading ? "Refreshing…" : "Refresh"}</button></div>`;
}
function renderResultsMain(study) {
  return `<div class="results-wrap"><div class="results-inner">
    <div class="results-tabs">
      <button class="rtab ${ui.resultsTab==='summary'?'active':''}" data-action="set-results-tab" data-tab="summary">Summary</button>
      <button class="rtab ${ui.resultsTab==='individual'?'active':''}" data-action="set-results-tab" data-tab="individual">Individual responses</button>
    </div>
    ${renderResultsSyncBar(study)}
    ${getResponses(study).length === 0 ? `
      <div class="results-empty">${decorativeBloom("")}<div>No responses yet. Publish your study and share the link to start collecting data.</div></div>
    ` : ui.resultsTab === "summary" ? renderResultsSummary(study) : renderResultsIndividual(study)}
  </div></div>`;
}

function renderResultsSummary(study) {
  const s = computeSummary(study);
  const susBlock = study.blocks.find(b => b.type === "sus");
  const seqBlocks = study.blocks.filter(b => b.type === "seq");
  const demoBlock = study.blocks.find(b => b.type === "demographics");
  const openBlocks = study.blocks.filter(b => b.type === "openended");

  const statCards = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${s.count}</div><div class="lbl">Responses</div></div>
      ${susBlock ? `<div class="stat-card"><div class="num">${s.susAvg!=null?s.susAvg.toFixed(1):"—"}<small> /100</small></div><div class="lbl">Average SUS score</div><span class="grade-pill grade-${s.susGrade.tone}">${s.susGrade.label}</span></div>` : ""}
    </div>`;

  const seqSection = seqBlocks.length ? `
    <div class="section-title">Task ease (SEQ)</div>
    ${seqBlocks.map(b => {
      const vals = getResponses(study).map(r => r.answers[b.id]).filter(v => v != null);
      const avg = vals.length ? vals.reduce((a,c)=>a+c,0)/vals.length : null;
      return `
      <div class="bar-row">
        <div class="bar-row-top"><span class="q">${esc(b.config.question)}</span><span class="v">${avg!=null?avg.toFixed(1)+" / 7":"No data"}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${avg!=null?(avg/7*100):0}%"></div></div>
      </div>`;
    }).join("")}` : "";

  const demoSection = demoBlock ? `
    <div class="section-title">Demographics</div>
    ${demoBlock.config.fields.map(f => {
      const answers = getResponses(study).map(r => (r.answers[demoBlock.id]||{})[f.id]).filter(Boolean);
      if (!answers.length) return `<div class="bar-row"><div class="bar-row-top"><span class="q">${esc(f.label)}</span><span class="v">No data</span></div></div>`;
      if (f.type === "select") {
        const counts = {};
        answers.forEach(a => counts[a] = (counts[a]||0) + 1);
        const max = Math.max(...Object.values(counts));
        return `<div class="bar-row"><div class="bar-row-top"><span class="q">${esc(f.label)}</span></div>
          ${Object.entries(counts).map(([opt,cnt]) => `
            <div class="option-bar"><span class="lab">${esc(opt)}</span><div class="bar-track"><div class="bar-fill" style="width:${(cnt/max*100)}%"></div></div><span class="cnt">${cnt}</span></div>
          `).join("")}
        </div>`;
      }
      return `<div class="bar-row"><div class="bar-row-top"><span class="q">${esc(f.label)}</span></div>
        ${answers.slice(0,6).map(a => `<div class="feedback-item">${esc(a)}</div>`).join("")}
      </div>`;
    }).join("")}` : "";

  const abBlocks = study.blocks.filter(b => b.type === "abtest");
  const abSection = abBlocks.map(b => {
    const answers = getResponses(study).map(r => r.answers[b.id]).filter(Boolean);
    const total = answers.length;
    const countA = answers.filter(a => a.choice === "A").length;
    const countB = answers.filter(a => a.choice === "B").length;
    const countN = answers.filter(a => a.choice === "neutral").length;
    const pct = n => total ? Math.round((n / total) * 100) : 0;
    const strengths = answers.map(a => a.strength).filter(v => v != null);
    const avgStrength = strengths.length ? (strengths.reduce((s,v)=>s+v,0) / strengths.length) : null;
    const whys = answers.map(a => a.why).filter(Boolean);
    return `
      <div class="section-title">${esc(b.config.title)}</div>
      ${total === 0 ? `<div class="hint-text">No responses yet.</div>` : `
        <div class="ab-split-row">
          <div class="ab-split-seg" style="flex:${Math.max(pct(countA),4)};background:var(--pine-500);" title="${esc(b.config.variantA.label)}: ${pct(countA)}%"></div>
          <div class="ab-split-seg" style="flex:${Math.max(pct(countN),countN?4:0)};background:var(--line);" title="No preference: ${pct(countN)}%"></div>
          <div class="ab-split-seg" style="flex:${Math.max(pct(countB),4)};background:var(--purple-500);" title="${esc(b.config.variantB.label)}: ${pct(countB)}%"></div>
        </div>
        <div class="ab-split-legend">
          <span><span class="ab-legend-dot" style="background:var(--pine-500);"></span>${esc(b.config.variantA.label)} — ${countA} (${pct(countA)}%)</span>
          ${countN ? `<span><span class="ab-legend-dot" style="background:var(--line);"></span>No preference — ${countN} (${pct(countN)}%)</span>` : ""}
          <span><span class="ab-legend-dot" style="background:var(--purple-500);"></span>${esc(b.config.variantB.label)} — ${countB} (${pct(countB)}%)</span>
        </div>
        ${avgStrength != null ? `<div class="hint-text" style="margin:10px 0 4px;">Average preference strength: <strong style="color:var(--ink);">${avgStrength.toFixed(1)} / 5</strong></div>` : ""}
        ${whys.length ? `<div style="margin-top:10px;">${whys.map(w => `<div class="feedback-item">${esc(w)}</div>`).join("")}</div>` : ""}
      `}
    `;
  }).join("");

  const openSection = openBlocks.map(b => {
    const answers = getResponses(study).map(r => r.answers[b.id]).filter(Boolean);
    return `
      <div class="section-title">${esc(b.config.prompt)}</div>
      ${answers.length ? answers.map(a => `<div class="feedback-item">${esc(a)}</div>`).join("") : `<div class="hint-text">No responses yet.</div>`}
    `;
  }).join("");

  return statCards + seqSection + abSection + demoSection + openSection;
}

function renderResultsIndividual(study) {
  const susBlock = study.blocks.find(b => b.type === "sus");
  const rows = getResponses(study).slice().reverse().map(r => {
    const susScore = susBlock ? scoreSUS(r.answers[susBlock.id]) : null;
    const open = ui.expandedResponse === r.id;
    return `
      <div class="response-card">
        <div class="response-head" data-action="toggle-response" data-id="${r.id}">
          <span class="l">${fmtDate(r.submittedAt)}</span>
          <span class="r">${susScore!=null?`SUS ${susScore.toFixed(0)}`:""} ${icon(open?"chevronUp":"chevronDown","")}</span>
        </div>
        <div class="response-body ${open?"open":""}">
          ${study.blocks.filter(b => b.type !== "welcome" && b.type !== "thankyou" && b.type !== "task").map(b => {
            const meta = BLOCK_REGISTRY[b.type];
            const ans = r.answers[b.id];
            let display = "—";
            if (b.type === "seq") display = ans != null ? ans + " / 7" : "—";
            else if (b.type === "sus") { const sc = scoreSUS(ans); display = sc != null ? sc.toFixed(1) + " / 100" : "—"; }
            else if (b.type === "openended") display = ans || "—";
            else if (b.type === "demographics") display = ans ? b.config.fields.map(f => `${f.label}: ${esc((ans[f.id])||"—")}`).join(" · ") : "—";
            else if (b.type === "abtest") {
              if (!ans || !ans.choice) display = "—";
              else {
                const chosenLabel = ans.choice === "A" ? b.config.variantA.label : ans.choice === "B" ? b.config.variantB.label : "No preference";
                display = esc(chosenLabel) + (ans.strength ? ` · strength ${ans.strength}/5` : "") + (ans.why ? ` · "${esc(ans.why)}"` : "");
              }
            }
            return `<div class="resp-row"><div class="resp-q">${esc(meta.label)}</div><div class="resp-a">${typeof display === "string" ? display : esc(String(display))}</div></div>`;
          }).join("")}
        </div>
      </div>`;
  }).join("");
  return `<div>${rows}</div>`;
}
